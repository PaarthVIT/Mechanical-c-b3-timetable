<style>

t-align:center;color:#727b91;font-size:12px;margin-top:18px;line-height:1.5}.mini{display:flex;gap:7px;margin-top:14px}.chip{border-radius:10px;padding:7px 10px;background:#ffffff0a;color:#b8c0d3;font-size:11px;font-weight:750}.green{color:var(--green)}.pink{color:var(--pink)}.amber{color:var(--amber)}
</style></head><body><main class="wrap"><div class="top"><span><i class="dot"></i>MECHANICAL / B3</span><span>LIVE TIMETABLE</span></div><div class="clock" id="clock">--:--</div><div class="date" id="date">Loading date…</div><section class="hero"><div class="eyebrow" id="eyebrow">CHECKING SCHEDULE</div><div class="headline" id="headline">One sec…</div><div class="sub" id="sub">Finding your next class</div><div class="roomrow"><div><div class="roomlabel" id="timelabel">CLASS TIME</div><div class="times" id="times">—</div></div><div style="text-align:right"><div class="roomlabel">ROOM</div><div class="room" id="room">—</div></div></div></section><section class="next" id="nextcard" hidden><div class="label">UP NEXT</div><div class="nextname" id="nextname"></div><div class="nextmeta" id="nextmeta"></div></section><div class="mini"><span class="chip">IST · India</span><span class="chip">B3 batch</span><span class="chip">Auto-refresh</span></div><a class="btn" href="https://paarthvit.github.io/Mechanical-c-b3-timetable/">OPEN FULL TIMETABLE ↗</a><div class="foot">A compact companion to your existing timetable.<br>Keep this page open for the live countdown.</div></main>
<script>
const timetable={
2:[{s:8,e:10,n:'Logic & Quantitative Aptitude 1',r:'E214',t:'Theory',c:'logic'},{s:10,e:11,n:'Environmental Studies',r:'E214',t:'Theory',c:'env'},{s:12,e:13,n:'Engineering Robotics',r:'E309',t:'Theory',c:'robotics'},{s:13,e:14,n:'Calculus',r:'E309',t:'Theory',c:'calculus'}],
3:[{s:8,e:9,n:'Environmental Studies',r:'E312',t:'Theory',c:'env'},{s:9,e:10,n:'Programming for Engineers',r:'E312',t:'Theory',c:'programming'},{s:10,e:12,n:'Programming Lab · B3',r:'E112',t:'Lab',c:'programming'}],
4:[{s:8,e:10,n:'Engineering Robotics Lab · B3',r:'E301',t:'Lab',c:'robotics'},{s:10,e:11,n:'Design Thinking & Ideation',r:'E303',t:'Theory',c:'design'},{s:12,e:13,n:'English A-language',r:'E309',t:'Theory',c:'english'},{s:13,e:14,n:'Calculus',r:'E309',t:'Theory',c:'calculus'}],
5:[{s:10,e:11,n:'English A-language',r:'E303',t:'Theory',c:'english'},{s:11,e:12,n:'Environmental Studies',r:'E303',t:'Theory',c:'env'},{s:13,e:14,n:'Design Thinking & Ideation',r:'E309',t:'Theory',c:'design'},{s:14,e:15,n:'Calculus Tutorial · B3',r:'E302',t:'Tutorial',c:'calculus'}],
6:[{s:10,e:11,n:'Calculus',r:'E215',t:'Theory',c:'calculus'},{s:13,e:14,n:'Programming for Engineers',r:'E209',t:'Theory',c:'programming'},{s:15,e:17,n:'Programming Lab · B3',r:'D305',t:'Lab',c:'programming'},{s:17,e:18,n:'Engineering Robotics',r:'E209',t:'Theory',c:'robotics'}]};
const names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function istNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}))}function hm(m){let h=Math.floor(m/60),mi=m%60;return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`}function pretty(m){let h=Math.floor(m/60),mi=m%60,ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(mi).padStart(2,'0')} ${ap}`}function left(ms){let total=Math.max(0,Math.floor(ms/1000)),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;if(h>0)return `${h}h ${m}m`;if(m>0)return `${m}m ${s}s`;return `${s}s`}function clsDate(base,cls){let d=new Date(base);d.setHours(cls.s,0,0,0);return d}function update(){let n=istNow(),dow=n.getDay(),mins=n.getHours()*60+n.getMinutes(),secs=n.getSeconds();document.getElementById('clock').textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});document.getElementById('date').textContent=n.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});let arr=timetable[dow]||[],cur=arr.find(c=>mins>=c.s*60&&mins<c.e*60),next=arr.find(c=>c.s*60>mins);let eyebrow=document.getElementById('eyebrow'),head=document.getElementById('headline'),sub=document.getElementById('sub'),room=document.getElementById('room'),times=document.getElementById('times'),tl=document.getElementById('timelabel'),card=document.getElementById('nextcard');card.hidden=true;if(cur){eyebrow.textContent='● CLASS IN PROGRESS';eyebrow.style.color='var(--green)';head.textContent=cur.n;sub.textContent=`${cur.t} · Ends in ${left((cur.e*60-mins)*60000-secs*1000)}`;room.textContent=cur.r;times.textContent=`${pretty(cur.s*60)} – ${pretty(cur.e*60)}`;tl.textContent='ENDS AT';if(next){card.hidden=false;document.getElementById('nextname').textContent=next.n;document.getElementById('nextmeta').textContent=`${pretty(next.s*60)} · Room ${next.r} · In ${left(((next.s*60-mins)*60000)-secs*1000)}`}}else if(next){let gap=next.s*60-mins;eyebrow.textContent=arr.length?'✦ FREE WINDOW':'UP NEXT';eyebrow.style.color='var(--amber)';head.textContent=arr.length?`FREE FOR ${left(gap*60000-secs*1000)}`:`STARTS IN ${left((gap*60000)-secs*1000)}`;sub.textContent=`Next: ${next.n}`;room.textContent=next.r;times.textContent=`${pretty(next.s*60)} – ${pretty(next.e*60)}`;tl.textContent='NEXT CLASS';}else{let futureDays=[];for(let offset=1;offset<=7;offset++){let nd=(dow+offset)%7;if(timetable[nd]?.length){futureDays.push({offset,day:nd,c:timetable[nd][0]});break}}if(!arr.length||mins>=Math.max(...arr.map(c=>c.e*60))){eyebrow.textContent='✓ SCHEDULE CLEAR';eyebrow.style.color='var(--green)';head.textContent='DONE FOR TODAY';sub.textContent=futureDays.length?`Next college day: ${names[futureDays[0].day]}`:'No upcoming classes';room.textContent='—';times.textContent=futureDays.length?`${pretty(futureDays[0].c.s*60)} · ${futureDays[0].c.n}`:'Enjoy your day';tl.textContent='NEXT DAY';if(futureDays.length){card.hidden=false;document.getElementById('nextname').textContent=futureDays[0].c.n;document.getElementById('nextmeta').textContent=`${names[futureDays[0].day]} · ${pretty(futureDays[0].c.s*60)} · Room ${futureDays[0].c.r}`}}else{eyebrow.textContent='NO CLASS RIGHT NOW';head.textContent='FREE FOR TODAY';sub.textContent='No more classes scheduled today';room.textContent='—';times.textContent='';tl.textContent='STATUS'}}}
update();setInterval(update,1000);
</script></body></html>
